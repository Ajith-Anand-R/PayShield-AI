version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: payshield
      POSTGRES_USER: payshield
      POSTGRES_PASSWORD: payshield_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://payshield:payshield_dev@postgres:5432/payshield
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8001/api
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pg_data:
